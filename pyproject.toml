[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r6sss"
description = "R6SSS Web API Wrapper Library"
readme = "README.md"
authors = [
	{name = "Milkeyyy"}
]
requires-python = ">=3.11.0"
dynamic = ["version"]
keywords = [
	"rainbow six siege",
	"r6",
	"server status",
	"api wrapper",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Typing :: Typed",
]
dependencies = [
	"datetimerange>=2.3.2",
	"httpx2>=2.15.1",
]

[project.urls]
Homepage = "https://github.com/Milkeyyy/R6SSS_Python"
Repository = "https://github.com/Milkeyyy/R6SSS_Python"
Issues = "https://github.com/Milkeyyy/R6SSS_Python/issues"

[dependency-groups]
dev = [
	"pytest>=9.1.1",
	"ruff>=0.17.1",
]

[tool.uv]
exclude-newer = "1 day"

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true

[tool.hatch.version]
path = "src/r6sss/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/r6sss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.format]
docstring-code-format = true
indent-style = "tab"

[tool.ruff.lint]
select = ["ALL"]
# 無視するルール
ignore = [
    "BLE001", # キャッチする例外が明示されていない
    "COM812", # 末尾にカンマがない
    "CPY001", # 著作権表示を要求しない
    "EM101", # 例外のメッセージに文字列リテラルを許可
    "EM102", # 例外のメッセージに f-string を許可
    "FIX002", # TODO がある
    "ERA001", # コメントアウトされたコード
    "ICN001", # import の別名を強制しない
    "TRY003", # 例外のメッセージを呼び出し側で指定することを許可
    "D1",    # docstring が存在しない
    "D203",  # docstring の前に空白行がない
    "D206", # docstring にタブによるインデントが使用されている
    "D213",  # docstring の最初の行が空白行ではない
    "D400", # docstring の最初の行の末尾が句読点で終わっていない
    "D415", # 同上 (クエスチョンマークなども含む)
    "INP001", # __init__.py ファイルが欠けているパッケージあり
    "RUF001", # あいまいな Unicode 文字の文字列
    "RUF002", # あいまいな Unicode 文字の docstring
    "RUF003", # あいまいな Unicode 文字のコメント
    "SIM105", # try-except-pass ブロックを contextlib.suppress コンテキストマネージャーに置き換え
    "TD001", # invalid todo tag
    "TD002", # missing todo author
    "TD003", # missing todo link
    "W191", # インデントがタブになっている
]
unfixable = [
    "F401", # unused import
    "F841", # unused variable
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
	"ANN001", # テスト関数の引数に型注釈を要求しない
	"ANN201", # テスト関数の戻り値に型注釈を要求しない
	"ANN202", # テスト用ヘルパーの戻り値に型注釈を要求しない
	"ARG001", # テスト用ハンドラの未使用引数を許可
	"PLR2004", # テスト内のマジックナンバーを許可
	"S101", # テスト内の assert を許可
]
